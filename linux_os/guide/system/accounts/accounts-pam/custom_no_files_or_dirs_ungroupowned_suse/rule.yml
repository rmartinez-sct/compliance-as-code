documentation_complete: true

title: 'Ensure All Files and Directories Have a Valid Group Owner'

description: |-
    All files and directories must belong to a valid defined group. 
    This rule verifies that no files or directories are left ungrouped.

rationale: |-
    Unowned files and directories do not directly imply a security problem, but they are generally
    a sign that something is amiss or that users/groups were deleted without cleaning up.

severity: medium

ocil_clause: 'files and directories exist that are not owned by a valid group'

ocil: |-
    Run the following command to find files without a valid group:
    <pre>$ sudo find / -xdev -nogroup</pre>
