documentation_complete: true

title: 'Ensure User Dot Files Have No Group or Other Write Permissions (Custom)'

description: |-
    Ensure that all hidden files (<tt>.*</tt>) in interactive users' home directories 
    do not have write permissions for groups or others.
    <br />
    The fix will run the following command on affected files:
    <pre>$ sudo chmod go-w /home/USER/.*</pre>

rationale: |-
    Incorrect permissions on user configuration and history files may enable malicious 
    users to recover sensitive information or modify the environment of other users.

severity: medium

ocil_clause: 'hidden files are group or world writable'

ocil: |-
    To verify that no hidden files are group or world writable, run the following command:
    <pre>$ sudo find /home -type f -name '\.*' \( -perm -0020 -o -perm -0002 \)</pre>
    There should be no output.
