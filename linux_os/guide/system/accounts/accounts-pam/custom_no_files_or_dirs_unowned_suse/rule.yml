documentation_complete: true

title: 'Ensure All Files and Directories Have a Valid Owner'

description: |-
    All files and directories must belong to a valid defined user. 
    This rule verifies that no files or directories are left without a user owner.

rationale: |-
    Unowned files and directories may be caused by an intruder, incorrect software installation,
    or failure to remove all files belonging to a deleted account.

severity: medium

ocil_clause: 'files and directories exist that are not owned by a valid user'

ocil: |-
    Run the following command to find files without a valid user:
    <pre>$ sudo find / -xdev -nouser</pre>
