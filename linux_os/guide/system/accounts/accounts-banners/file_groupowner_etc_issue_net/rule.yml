documentation_complete: true

title: 'Verify ownership and existence of System Login Banner for Remote Connections'

description: |-
    This rule checks that <tt>/etc/issue.net</tt> exists and is owned by the root user.
    If the file does not exist, the remediation will create it and apply the correct ownership and permissions.

rationale: |-
    Display of a standardized and approved use notification before granting
    access to the operating system ensures privacy and security notification
    verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance.<br />
    Proper ownership will ensure that only root user can modify the banner.

severity: medium

identifiers:
    cce@rhel8: CCE-86054-4
    cce@rhel9: CCE-86057-7
    cce@rhel10: CCE-86969-3
    cce@sle12: CCE-92237-7
    cce@sle15: CCE-91359-0
    cce@sle16: CCE-96310-8
    cce@slmicro5: CCE-94056-9

references:
    cis@sle12: 1.8.1.6
    cis@sle15: 1.8.1.6

ocil_clause: 'the file does not exist or is not owned by root'

ocil: |-
    To check the ownership of /etc/issue.net, run the command:
    $ stat -c "%U" /etc/issue.net
    It should return "root".
