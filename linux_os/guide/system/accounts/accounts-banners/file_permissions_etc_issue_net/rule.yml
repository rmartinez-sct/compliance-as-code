documentation_complete: true

title: 'Verify permissions and existence of System Login Banner for Remote Connections'

description: |-
    This rule checks that <tt>/etc/issue.net</tt> exists and has permissions set to 0644.
    If the file does not exist, the remediation will create it and apply the correct permissions.

rationale: |-
    Display of a standardized and approved use notification before granting
    access to the operating system ensures privacy and security notification
    verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance.<br />
    Proper permissions will ensure that only root user can modify the banner.

severity: medium

identifiers:
    cce@rhel8: CCE-86047-8
    cce@rhel9: CCE-86048-6
    cce@rhel10: CCE-87831-4
    cce@sle12: CCE-92235-1
    cce@sle15: CCE-91357-4
    cce@sle16: CCE-95961-9
    cce@slmicro5: CCE-94053-6

references:
    cis@sle12: 1.8.1.6
    cis@sle15: 1.8.1.6

ocil_clause: 'the file does not exist or does not have 0644 permissions'

ocil: |-
    To check the permissions of /etc/issue.net, run the command:
    $ stat -c "%a" /etc/issue.net
    It should return "644".
