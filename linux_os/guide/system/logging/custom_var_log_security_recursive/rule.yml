documentation_complete: true

title: 'Verify Permissions, Owner and Group of All Logs in /var/log (Scripted)'

description: |-
    This custom rule uses an advanced SCE script to recursively check all files in 
    <tt>/var/log</tt>. It reads <tt>UID_MIN</tt> and uses a case statement to apply 
    specific security limits for wtmp, secure, sssd, journals, and generic logs.

rationale: |-
    Log files contain sensitive information. A dynamic, context-aware script ensures 
    system services can write to their logs while preventing unauthorized access.

severity: high

ocil_clause: 'any file in /var/log has incorrect permissions, owner, or group'

ocil: |-
    The SCE check will automatically audit every file. 
    If a violation is found, it will output the exact file and expected ownership/permissions.
